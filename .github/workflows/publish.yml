name: HXC DSH Toolkit release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Toolkit stable release tag, for example v1.1.0'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

# Serialize publication so two versions do not race for Latest.
concurrency:
  group: personal-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'hxc0624/dsh-archive-manager'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the Toolkit release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate tag and channel
        run: node scripts/fork-release.mjs validate "$RELEASE_TAG"

      - name: Install development dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --config.minimumReleaseAge=1440 --registry=https://registry.npmjs.org/

      - name: Verify build, tests, compatibility and package
        run: pnpm verify

      - name: Package the verified build
        run: |
          mkdir -p .fork-release
          pnpm pack --out .fork-release/dsh-archive-manager.tgz
          node scripts/fork-release.mjs assets "$RELEASE_TAG"
          node scripts/extract-release-notes.mjs "$RELEASE_TAG" .fork-release/release-notes.md

      - name: Publish package and checksum to this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fork-release.mjs publish "$RELEASE_TAG"
